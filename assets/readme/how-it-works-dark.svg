<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1320" viewBox="0 0 2400 1320">
<rect width="2400" height="1320" fill="#0E0E0C"/>
<rect x="660" y="80" width="500" height="1160" fill="#F2361F" />
<text x="704" y="164" font-family="Adwaita Sans" font-size="52" font-weight="700" fill="#0E0E0C" text-anchor="start" letter-spacing="-0.78">Tomacco</text>
<text x="694" y="452" font-family="Adwaita Sans" font-size="231" font-weight="800" fill="#0E0E0C" text-anchor="start" letter-spacing="-6.93">225</text>
<text x="704" y="548" font-family="Adwaita Sans" font-size="84" font-weight="700" fill="#0E0E0C" text-anchor="start" letter-spacing="-2.10">typed</text>
<text x="704" y="642" font-family="Adwaita Sans" font-size="84" font-weight="700" fill="#0E0E0C" text-anchor="start" letter-spacing="-2.10">operations</text>
<text x="704" y="1102" font-family="Adwaita Sans" font-size="50" font-weight="500" fill="#0E0E0C" text-anchor="start" letter-spacing="0.00">One schema.</text>
<text x="704" y="1164" font-family="Adwaita Sans" font-size="50" font-weight="500" fill="#0E0E0C" text-anchor="start" letter-spacing="0.00">Durable jobs.</text>
<polyline points="80,82 660,82" fill="none" stroke="#F4F2EC" stroke-width="4" stroke-linecap="butt" stroke-linejoin="miter" />
<text x="76" y="204" font-family="Adwaita Sans" font-size="104" font-weight="700" fill="#F4F2EC" text-anchor="start" letter-spacing="-3.12">Your agent</text>
<text x="80" y="284" font-family="Adwaita Sans" font-size="50" font-weight="400" fill="#96948B" text-anchor="start" letter-spacing="0.00">Claude Code, Codex,</text>
<text x="80" y="348" font-family="Adwaita Sans" font-size="50" font-weight="400" fill="#96948B" text-anchor="start" letter-spacing="0.00">any MCP client.</text>
<text x="80" y="412" font-family="Adwaita Sans" font-size="50" font-weight="400" fill="#96948B" text-anchor="start" letter-spacing="0.00">Over MCP or the</text>
<text x="80" y="476" font-family="Adwaita Sans" font-size="50" font-weight="400" fill="#96948B" text-anchor="start" letter-spacing="0.00">tomaccoctl JSON CLI.</text>
<polyline points="80,662 660,662" fill="none" stroke="#F4F2EC" stroke-width="4" stroke-linecap="butt" stroke-linejoin="miter" />
<text x="76" y="784" font-family="Adwaita Sans" font-size="104" font-weight="700" fill="#F4F2EC" text-anchor="start" letter-spacing="-3.12">You</text>
<text x="80" y="864" font-family="Adwaita Sans" font-size="50" font-weight="400" fill="#96948B" text-anchor="start" letter-spacing="0.00">In the Qt desktop.</text>
<text x="80" y="928" font-family="Adwaita Sans" font-size="50" font-weight="400" fill="#96948B" text-anchor="start" letter-spacing="0.00">Watch, and take over</text>
<text x="80" y="992" font-family="Adwaita Sans" font-size="50" font-weight="400" fill="#96948B" text-anchor="start" letter-spacing="0.00">at any time.</text>
<polyline points="1160,82 2320,82" fill="none" stroke="#F4F2EC" stroke-width="4" stroke-linecap="butt" stroke-linejoin="miter" />
